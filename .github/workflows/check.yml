name: Debian-family compatibility
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            label: debian12
          - image: debian:13
            label: debian13
          - image: ubuntu:22.04
            label: ubuntu22
          - image: ubuntu:24.04
            label: ubuntu24
    container:
      image: ${{ matrix.image }}
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential python3 python3-gi gir1.2-gtk-3.0 librsvg2-common shellcheck desktop-file-utils grub-common grub2-common bubblewrap xvfb xauth xdg-user-dirs dbus-daemon fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt
          targets: x86_64-unknown-linux-musl
      - name: Native unit, isolated backend and GTK checks
        run: scripts/check.sh
      - name: Build static portable Debian package
        run: scripts/build-portable.sh
      - name: Static helper integration
        env:
          RBM_TEST_BINARY: target/x86_64-unknown-linux-musl/release/rbm
        run: python3 tests/isolated_system.py
      - uses: actions/upload-artifact@v4
        with:
          name: rust-boot-manager-${{ matrix.label }}
          path: dist/
