# Static fixture, never executed.
set default="${saved_entry}"
if [ "${next_entry}" ]; then
 set default="${next_entry}"
 set next_entry=
 save_env next_entry
fi
menuentry 'Debian GNU/Linux' --class debian $menuentry_id_option 'gnulinux-simple-123' {
 linux /vmlinuz root=UUID=123 ro quiet
}
submenu 'Advanced options for Debian' --id 'gnulinux-advanced-123' {
 menuentry 'Debian GNU/Linux, recovery mode' --id 'recovery-123' {
  linux /vmlinuz single
 }
}
menuentry 'Windows Boot Manager (UEFI)' --id 'windows-456' {
 chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
